<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="337" viewBox="0 0 600 337" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{WALL1}}"/>
      <stop offset="1" stop-color="{{WALL2}}"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="120" y="60" width="360" height="212" rx="9"/>
    </clipPath>
  </defs>

  <!-- wallpaper -->
  <rect width="600" height="337" fill="url(#wall)"/>

  <!-- window shadow -->
  <rect x="120" y="66" width="360" height="212" rx="9" fill="#000000" opacity="0.22"/>

  <!-- window -->
  <g clip-path="url(#win)">
    <rect x="120" y="60" width="360" height="212" fill="{{WINDOW}}"/>
    <!-- content pane -->
    <rect x="230" y="60" width="250" height="212" fill="{{BASE}}"/>
    <!-- titlebar -->
    <rect x="120" y="60" width="360" height="34" fill="{{HEADER}}"/>
    <circle cx="462" cy="77" r="5" fill="{{CLOSE}}"/>
    <circle cx="446" cy="77" r="5" fill="{{HEADERFG}}" opacity="0.35"/>
    <circle cx="430" cy="77" r="5" fill="{{HEADERFG}}" opacity="0.35"/>
    <rect x="136" y="72" width="90" height="10" rx="5" fill="{{HEADERFG}}" opacity="0.55"/>

    <!-- sidebar items -->
    <rect x="136" y="110" width="80" height="13" rx="6" fill="{{ACCENT}}"/>
    <rect x="136" y="133" width="80" height="10" rx="5" fill="{{FG}}" opacity="0.28"/>
    <rect x="136" y="151" width="80" height="10" rx="5" fill="{{FG}}" opacity="0.28"/>
    <rect x="136" y="169" width="80" height="10" rx="5" fill="{{FG}}" opacity="0.28"/>
    <rect x="136" y="187" width="80" height="10" rx="5" fill="{{FG}}" opacity="0.28"/>

    <!-- content -->
    <rect x="248" y="112" width="180" height="12" rx="6" fill="{{FG}}" opacity="0.78"/>
    <rect x="248" y="134" width="210" height="9" rx="4" fill="{{FG}}" opacity="0.3"/>
    <rect x="248" y="150" width="200" height="9" rx="4" fill="{{FG}}" opacity="0.3"/>
    <rect x="248" y="166" width="162" height="9" rx="4" fill="{{FG}}" opacity="0.3"/>
    <rect x="248" y="196" width="98" height="30" rx="6" fill="{{ACCENT}}"/>
    <rect x="266" y="208" width="62" height="8" rx="4" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- panel -->
  <rect x="0" y="305" width="600" height="32" fill="{{PANEL}}"/>
  <rect x="12" y="313" width="16" height="16" rx="4" fill="{{ACCENT}}"/>
  <rect x="40" y="313" width="16" height="16" rx="4" fill="{{HEADERFG}}" opacity="0.4"/>
  <rect x="64" y="313" width="16" height="16" rx="4" fill="{{HEADERFG}}" opacity="0.4"/>
  <rect x="540" y="315" width="48" height="12" rx="4" fill="{{HEADERFG}}" opacity="0.5"/>
</svg>
