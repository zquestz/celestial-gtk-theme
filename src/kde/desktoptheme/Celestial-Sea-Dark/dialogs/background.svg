<svg width="100" height="100" version="1.1" xmlns="http://www.w3.org/2000/svg">
 <!-- Celestial popup: menu background, 1px border, 3px radius - matches GTK popovers -->
 <defs>
  <linearGradient id="sh-t" x1="0" y1="1" x2="0" y2="0">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh-b" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh-l" x1="1" y1="0" x2="0" y2="0">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh-r" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="sh-tl" cx="1" cy="1" r="1">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sh-tr" cx="0" cy="1" r="1">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sh-bl" cx="1" cy="0" r="1">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sh-br" cx="0" cy="0" r="1">
   <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
   <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
 </defs>
 <!-- frame fills -->
 <path id="topleft" d="M 0,8 V 3 A 3,3 0 0 1 3,0 H 8 V 8 Z" fill="#1b2224"/>
 <rect id="top" x="8" y="0" width="8" height="8" fill="#1b2224"/>
 <path id="topright" d="M 16,0 h 5 A 3,3 0 0 1 24,3 V 8 H 16 Z" fill="#1b2224"/>
 <rect id="left" x="0" y="8" width="8" height="8" fill="#1b2224"/>
 <rect id="center" x="8" y="8" width="8" height="8" fill="#1b2224"/>
 <rect id="right" x="16" y="8" width="8" height="8" fill="#1b2224"/>
 <path id="bottomleft" d="M 0,16 H 8 V 24 H 3 A 3,3 0 0 1 0,21 Z" fill="#1b2224"/>
 <rect id="bottom" x="8" y="16" width="8" height="8" fill="#1b2224"/>
 <path id="bottomright" d="M 16,16 H 24 V 21 A 3,3 0 0 1 21,24 H 16 Z" fill="#1b2224"/>
 <!-- 1px outer border, drawn onto the frame slices -->
 <path d="M 0.5,8 V 3 A 2.5,2.5 0 0 1 3,0.5 H 8" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 8,0.5 H 16" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 16,0.5 h 5 A 2.5,2.5 0 0 1 23.5,3 V 8" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 0.5,8 V 16" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 23.5,8 V 16" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 0.5,16 v 5 A 2.5,2.5 0 0 0 3,23.5 H 8" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 8,23.5 H 16" fill="none" stroke="#141a1b" stroke-width="1"/>
 <path d="M 23.5,16 v 5 A 2.5,2.5 0 0 1 21,23.5 h -5" fill="none" stroke="#141a1b" stroke-width="1"/>
 <!-- content margins -->
 <rect id="hint-top-margin" x="30" y="0" width="4" height="6" fill="#ff00ff"/>
 <rect id="hint-bottom-margin" x="30" y="10" width="4" height="6" fill="#ff00ff"/>
 <rect id="hint-left-margin" x="38" y="0" width="6" height="4" fill="#ff00ff"/>
 <rect id="hint-right-margin" x="48" y="0" width="6" height="4" fill="#ff00ff"/>
 <!-- shape mask -->
 <path id="mask-topleft" d="M 0,38 V 33 A 3,3 0 0 1 3,30 H 8 V 38 Z" fill="#000000"/>
 <rect id="mask-top" x="8" y="30" width="8" height="8" fill="#000000"/>
 <path id="mask-topright" d="M 16,30 h 5 A 3,3 0 0 1 24,33 V 38 H 16 Z" fill="#000000"/>
 <rect id="mask-left" x="0" y="38" width="8" height="8" fill="#000000"/>
 <rect id="mask-center" x="8" y="38" width="8" height="8" fill="#000000"/>
 <rect id="mask-right" x="16" y="38" width="8" height="8" fill="#000000"/>
 <path id="mask-bottomleft" d="M 0,46 H 8 V 54 H 3 A 3,3 0 0 1 0,51 Z" fill="#000000"/>
 <rect id="mask-bottom" x="8" y="46" width="8" height="8" fill="#000000"/>
 <path id="mask-bottomright" d="M 16,46 H 24 V 51 A 3,3 0 0 1 21,54 H 16 Z" fill="#000000"/>
 <!-- soft drop shadow (like the GTK popover shadow) -->
 <rect id="shadow-topleft" x="60" y="0" width="6" height="4" fill="url(#sh-tl)"/>
 <rect id="shadow-top" x="66" y="0" width="8" height="4" fill="url(#sh-t)"/>
 <rect id="shadow-topright" x="74" y="0" width="6" height="4" fill="url(#sh-tr)"/>
 <rect id="shadow-left" x="60" y="4" width="6" height="8" fill="url(#sh-l)"/>
 <rect id="shadow-right" x="74" y="4" width="6" height="8" fill="url(#sh-r)"/>
 <rect id="shadow-bottomleft" x="60" y="12" width="6" height="8" fill="url(#sh-bl)"/>
 <rect id="shadow-bottom" x="66" y="12" width="8" height="8" fill="url(#sh-b)"/>
 <rect id="shadow-bottomright" x="74" y="12" width="6" height="8" fill="url(#sh-br)"/>
 <rect id="shadow-hint-top-margin" x="84" y="0" width="4" height="4" fill="#ff00ff"/>
 <rect id="shadow-hint-bottom-margin" x="84" y="8" width="4" height="8" fill="#ff00ff"/>
 <rect id="shadow-hint-left-margin" x="92" y="0" width="6" height="4" fill="#ff00ff"/>
 <rect id="shadow-hint-right-margin" x="92" y="8" width="6" height="4" fill="#ff00ff"/>
</svg>
